[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dallal_parser"
version = "1.0.0"
description = "Extract name, phone, governorate and address from Iraqi Instagram DM orders (cash on delivery)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dallal-parse = "dallal_parser.__main__:main"

[tool.setuptools]
packages = ["dallal_parser"]
